<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="theklif.ico">
    <title>Klif's Start Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #123524;
        --text: #F0EBE0;
        --accent: #FF8C42;
        --link-hover: var(--accent);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        margin: 0 auto;
        padding: 1em;
        font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        align-content: flex-start;
        column-gap: 3em;
        min-height: 100vh;
      }

      h1 {
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 600;
        width: 100%;
        text-align: center;
        color: var(--text);
        font-size: 1.5em;
        letter-spacing: 0.02em;
        margin: 0 0 0.5em;
      }

      .links {
        text-align: left;
        line-height: 2em;
        font-size: 2em;
        min-width: 250px;
        flex: 0 0 auto;
      }

      a {
        color: var(--text);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        color: var(--link-hover);
      }

      .corner-watermark {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 256px;
        opacity: 0.25;
        pointer-events: auto;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      .corner-watermark:hover {
        opacity: 1;
      }

      @media (max-width: 800px) {
        .links {
          max-width: 100%;
          padding-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>Klif's Start Page</h1>

    <div class="links" id="column-0"></div>
    <div class="links" id="column-1"></div>

    <img src="theklif.ico" class="corner-watermark" alt="">

    <script>
      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function buildColumnHTML(entries) {
        return entries
          .map(function (entry) {
            if (entry.divider) {
              return "<br>";
            }
            var target = entry.new_tab === false ? "" : ' target="_blank"';
            return (
              '<a href="' + escapeHtml(entry.url) + '"' + target + ">" +
              escapeHtml(entry.label) + "</a><br>"
            );
          })
          .join("");
      }

      fetch("links.json")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          data.columns.forEach(function (column, i) {
            var el = document.getElementById("column-" + i);
            if (el) {
              el.innerHTML = buildColumnHTML(column);
            }
          });
        })
        .catch(function (err) {
          console.error("Failed to load links.json:", err);
        });
    </script>
  </body>
</html>
