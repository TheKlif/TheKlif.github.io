<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="theklif.ico">
    <title>Klif's Start Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #123524;
        --text: #F0EBE0;
        --accent: #FF8C42;
        --link-hover: var(--accent);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        margin: 0 auto;
        padding: 1em;
        font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        align-content: flex-start;
        min-height: 100vh;
      }

      h1 {
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 600;
        width: 100%;
        text-align: center;
        color: var(--text);
        font-size: 1.5em;
        letter-spacing: 0.02em;
        margin: 0 0 0.5em;
      }

      .links {
        text-align: left;
        line-height: 2em;
        font-size: 2em;
      }

      a {
        color: var(--text);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }

      a:hover {
        text-decoration: underline;
        color: var(--link-hover);
      }

      .favicon {
        width: 1em;
        height: 1em;
        margin-right: 0.4em;
        border-radius: 4px;
        object-fit: contain;
      }

      .corner-watermark {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 256px;
        opacity: 0.25;
        pointer-events: auto;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      
      .corner-watermark:hover {
        opacity: 1;
      }

      .columns-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 3em;
        width: 100%;
      }
      
      #column-0 {
        justify-self: end;
      }
      
      #column-1 {
        justify-self: start;
      }

      @media (max-width: 800px) {
        .columns-wrapper {
          grid-template-columns: 1fr;
        }
        #column-0,
        #column-1 {
          justify-self: stretch;
        }
        #column-1 {
          margin-top: 1em;
          padding-top: 1em;
          border-top: 1px solid rgba(240, 235, 224, 0.2);
        }
        .links {
          font-size: 1.5em;
        }
      }
    </style>
  </head>
  <body>
    <h1>Klif's Start Page</h1>

    <div class="columns-wrapper">
      <div class="links" id="column-0"></div>
      <div class="links" id="column-1"></div>
    </div>

    <img src="theklif.ico" class="corner-watermark" alt="">

    <script>
      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function buildColumnHTML(entries) {
        return entries
          .map(function (entry) {
            if (entry.divider) {
              return "<br>";
            }
            var target = entry.new_tab === false ? "" : ' target="_blank"';
            
            var faviconHtml = "";
            try {
              var urlObj = new URL(entry.url);
              var domain = urlObj.hostname;
              var localFavicon = urlObj.origin + "/favicon.ico";
              var googleFavicon = "https://www.google.com/s2/favicons?domain=" + domain + "&sz=32";
              
              faviconHtml = '<img class="favicon" loading="lazy" src="' + 
                            escapeHtml(localFavicon) + 
                            '" data-fallback="' + 
                            escapeHtml(googleFavicon) + 
                            '" alt="">';
            } catch (e) {
              // Ignore missing or relative URLs for favicon parsing
            }

            return (
              '<a href="' + escapeHtml(entry.url) + '"' + target + ">" +
              faviconHtml + escapeHtml(entry.label) + "</a><br>"
            );
          })
          .join("");
      }

      // Capture phase listener for image load errors to swap to fallback
      document.addEventListener('error', function(e) {
        var target = e.target;
        if (target.tagName === 'IMG' && target.classList.contains('favicon') && target.dataset.fallback) {
          target.src = target.dataset.fallback;
          target.removeAttribute('data-fallback'); 
        }
      }, true);

      fetch("links.json")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          data.columns.forEach(function (column, i) {
            var el = document.getElementById("column-" + i);
            if (el) {
              el.innerHTML = buildColumnHTML(column);
            }
          });
        })
        .catch(function (err) {
          console.error("Failed to load links.json:", err);
        });
    </script>
  </body>
</html>
